---

name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RELEASE_PLATFORMS: "linux/amd64 linux/arm64 darwin/amd64 darwin/arm64"
  DOCKER_PLATFORMS: "linux/amd64,linux/arm64"
  GO_VERSION: "1.27.3"
  TRIVY_VERSION: v0.76.2

permissions:
  contents: read

jobs:
  preflight:
    name: Validate Release Tag
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Validate Tag And Source Commit
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must use canonical vMAJOR.MINOR.PATCH syntax: ${RELEASE_TAG}" >&2
            exit 1
          fi

          git fetch origin "${DEFAULT_BRANCH}"
          tag_commit="$(git rev-list -n 1 "${RELEASE_TAG}")"
          branch_commit="$(git rev-parse "origin/${DEFAULT_BRANCH}")"
          if [[ "${tag_commit}" != "${branch_commit}" ]]; then
            echo "Release tag ${RELEASE_TAG} points to ${tag_commit}, but origin/${DEFAULT_BRANCH} points to ${branch_commit}." >&2
            exit 1
          fi

          make release-chart-version-check VERSION="${RELEASE_TAG}"

  checks:
    name: Checks
    needs:
      - preflight
    uses: ./.github/workflows/checks.yml
    with:
      go-version: "1.27.3"
      release-platforms: "linux/amd64 linux/arm64 darwin/amd64 darwin/arm64"

  release:
    name: Release Artifacts
    runs-on: ubuntu-24.04
    needs:
      - checks
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build Release Archives
        run: make release-smoke VERSION="${{ github.ref_name }}" PLATFORMS="${{ env.RELEASE_PLATFORMS }}"

      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: dist/sbom.cdx.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ github.ref_name }}
          body: "Release ${{ github.ref_name }}"
          draft: true
          files: |
            dist/*.tar.gz
            dist/checksums.txt
            dist/sbom.cdx.json

  docker-publish:
    name: Publish Docker Image
    runs-on: ubuntu-24.04
    needs:
      - release
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: ${{ env.DOCKER_PLATFORMS }}
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          build-args: |
            LDFLAGS=-s -w -X main.version=${{ github.ref_name }}
            VERSION=${{ github.ref_name }}
            VCS_REF=${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign Docker Image
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  helm-publish:
    name: Publish Helm Chart
    runs-on: ubuntu-24.04
    needs:
      - docker-publish
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Ensure Helm Repository Branch
        shell: bash
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            exit 0
          fi

          worktree="$(mktemp -d)"
          trap 'git worktree remove --force "$worktree" >/dev/null 2>&1 || rm -rf "$worktree"' EXIT
          git worktree add --detach "$worktree"
          git -C "$worktree" switch --orphan gh-pages
          git -C "$worktree" clean -fdx
          touch "$worktree/.nojekyll"
          git -C "$worktree" add .nojekyll
          git -C "$worktree" commit -m "chore: initialize helm chart repository"
          git -C "$worktree" push origin gh-pages
          git worktree remove "$worktree"
          trap - EXIT

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@92c6b97fa9f664492a2592e0d1d80bc6bf378957 # v1.9.0
        with:
          charts_dir: deploy
          skip_existing: true
          packages_with_index: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

  finalize-release:
    name: Finalize Release
    runs-on: ubuntu-24.04
    needs:
      - helm-publish
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote Docker Image To Latest
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: docker buildx imagetools create --tag "${IMAGE}:latest" "${IMAGE}:${GITHUB_REF_NAME}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false --latest
