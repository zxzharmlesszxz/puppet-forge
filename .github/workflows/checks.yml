---

name: Checks

on:
  workflow_call:
    inputs:
      go-version:
        type: string
        default: "1.27.1"
      release-platforms:
        type: string
        default: "linux/amd64 linux/arm64 darwin/amd64 darwin/arm64"
      run-build:
        type: boolean
        default: false
      check-compose:
        type: boolean
        default: false
      upload-release-archives:
        type: boolean
        default: false
      upload-helm-chart:
        type: boolean
        default: false

permissions:
  contents: read

env:
  TRIVY_VERSION: v0.74.0

jobs:
  go-check:
    name: Go Check
    runs-on: ubuntu-24.04
    container:
      image: golang:${{ inputs.go-version }}-alpine

    steps:
      - name: Prepare Alpine
        shell: sh
        run: apk add --no-cache bash build-base ca-certificates git make tar

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download Go Modules
        run: make mod-download

      - name: Check Formatting
        run: make fmt-check

      - name: Vet
        run: make vet

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9

      - name: Unit Coverage
        run: make coverage-unit

      - name: Upload Unit Coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-unit
          path: coverage-unit.out
          if-no-files-found: error
          retention-days: 1

  security:
    name: Security
    runs-on: ubuntu-24.04
    needs:
      - go-check

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ inputs.go-version }}

      - name: Go Vulnerability And Security Scan
        run: make security-go

      - name: Filesystem Vulnerability, Secret, And License Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,license
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Filesystem Misconfiguration Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scan-ref: .
          scanners: misconfig
          trivy-config: .trivy-misconfig.yaml
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  browser:
    name: Browser Tests
    runs-on: ubuntu-24.04
    needs:
      - go-check

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ inputs.go-version }}

      - name: Run Browser Tests
        run: make test-browser

  build:
    name: Build Binary
    if: inputs.run-build
    runs-on: ubuntu-24.04
    container:
      image: golang:${{ inputs.go-version }}-alpine
    needs:
      - go-check

    steps:
      - name: Prepare Alpine
        shell: sh
        run: apk add --no-cache bash ca-certificates git make

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Build
        run: make build

      - name: Release Smoke
        run: make release-smoke PLATFORMS="${{ inputs.release-platforms }}"

      - name: Upload Release Archives
        if: inputs.upload-release-archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-archives
          path: |
            dist/*.tar.gz
            dist/checksums.txt
          if-no-files-found: error

  postgres-parity:
    name: PostgreSQL Parity
    runs-on: ubuntu-24.04
    container:
      image: golang:${{ inputs.go-version }}-alpine
    needs:
      - go-check
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: forge
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge
        options: >-
          --health-cmd "pg_isready -U forge -d forge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Prepare Alpine
        shell: sh
        run: apk add --no-cache bash build-base ca-certificates git make

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Run PostgreSQL Parity Coverage
        env:
          PUPPET_FORGE_TEST_POSTGRES_DSN: postgres://forge:forge@postgres:5432/forge?sslmode=disable
        run: make coverage-postgres

      - name: Upload PostgreSQL Coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-postgres
          path: coverage-postgres.out
          if-no-files-found: error
          retention-days: 1

  object-storage:
    name: Object Storage Integration
    runs-on: ubuntu-24.04
    needs:
      - go-check

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ inputs.go-version }}

      - name: Start MinIO
        run: |
          docker run --detach --name minio \
            --publish 9000:9000 \
            --env MINIO_ROOT_USER=minioadmin \
            --env MINIO_ROOT_PASSWORD=minioadmin \
            quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e server /data
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs minio
          exit 1

      - name: Start GCS Emulator
        run: |
          docker run --detach --name fake-gcs \
            --publish 4443:4443 \
            fsouza/fake-gcs-server:1.56.1@sha256:797ce226d62f947c009dc40246b30cfb456b8473d8241407f9d6f2c04e4d69ef \
            -scheme http -backend memory -public-host 127.0.0.1:4443
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4443/storage/v1/b >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs fake-gcs
          exit 1

      - name: Run Object Storage Coverage
        env:
          PUPPET_FORGE_TEST_GCS_ENDPOINT: http://127.0.0.1:4443
        run: make coverage-s3 coverage-gcs

      - name: Upload Object Storage Coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-object-storage
          path: |
            coverage-s3.out
            coverage-gcs.out
          if-no-files-found: error
          retention-days: 1

  coverage:
    name: Combined Coverage
    runs-on: ubuntu-24.04
    needs:
      - go-check
      - postgres-parity
      - object-storage

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ inputs.go-version }}

      - name: Download Coverage Profiles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-*
          path: .
          merge-multiple: true

      - name: Check Combined Coverage
        run: make coverage-merge-check

  docker-check:
    name: Docker Check
    runs-on: ubuntu-24.04
    needs:
      - go-check

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Docker Compose Config
        if: inputs.check-compose
        run: make compose-config

      - name: Docker Smoke
        run: make docker-smoke DOCKER_IMAGE=puppet-forge:ci

      - name: Docker Image Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: puppet-forge:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  helm-check:
    name: Helm Check
    runs-on: ubuntu-24.04
    needs:
      - go-check

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      - name: Helm Lint
        run: make helm-lint

      - name: Prometheus Rules Check
        run: make prometheus-rules-check

      - name: Helm Package
        run: make helm-package

      - name: Upload Helm Chart
        if: inputs.upload-helm-chart
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: helm-chart
          path: dist/charts/*.tgz
          if-no-files-found: error

  race:
    name: Race Tests
    runs-on: ubuntu-24.04
    container:
      image: golang:${{ inputs.go-version }}-alpine
    needs:
      - go-check

    steps:
      - name: Prepare Alpine
        shell: sh
        run: apk add --no-cache bash build-base ca-certificates git make

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Run Race Tests
        run: make test-race
