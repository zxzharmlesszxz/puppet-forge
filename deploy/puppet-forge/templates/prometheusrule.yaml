{{- if .Values.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "chart.fullname" . }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
    {{- with .Values.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.prometheusRule.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  groups:
    - name: puppet-forge.recording
      interval: 30s
      rules:
        - record: job_route:puppet_forge_http_requests:rate5m
          expr: sum by (job, route) (rate(puppet_forge_http_requests_total[5m]))

        - record: job_route_status:puppet_forge_http_requests:rate5m
          expr: sum by (job, route, status) (rate(puppet_forge_http_requests_total[5m]))

        - record: job_route:puppet_forge_http_panics:rate5m
          expr: sum by (job, route) (rate(puppet_forge_http_panics_total[5m]))

        - record: job_route:puppet_forge_http_error_ratio5m
          expr: |
            sum by (job, route) (
              rate(puppet_forge_http_requests_total{status=~"5..",route!~"/metrics|/healthz|/readyz"}[5m])
            )
            /
            clamp_min(
              sum by (job, route) (
                rate(puppet_forge_http_requests_total{route!~"/metrics|/healthz|/readyz"}[5m])
              ),
              0.001
            )

        - record: job_route:puppet_forge_http_latency_p95_seconds5m
          expr: |
            histogram_quantile(
              0.95,
              sum by (job, route, le) (
                rate(puppet_forge_http_request_duration_seconds_bucket{route!~"/metrics|/healthz|/readyz"}[5m])
              )
            )

        - record: job:puppet_forge_indexed_modules
          expr: sum by (job) (max by (job, owner) (puppet_forge_modules))

        - record: job:puppet_forge_publish_errors:rate5m
          expr: sum by (job) (rate(puppet_forge_publish_total{result="error"}[5m]))

        - record: job:puppet_forge_delete_errors:rate5m
          expr: sum by (job) (rate(puppet_forge_delete_total{result="error"}[5m]))

        - record: job:puppet_forge_artifact_deletion_errors:rate5m
          expr: sum by (job) (rate(puppet_forge_artifact_deletion_total{result="error"}[5m]))

        - record: job:puppet_forge_artifact_deletions_pending
          expr: max by (job) (puppet_forge_artifact_deletions_pending)

        - record: job_source:puppet_forge_artifact_stream_errors:rate5m
          expr: sum by (job, source) (rate(puppet_forge_artifact_stream_total{result="error"}[5m]))

        - record: job:puppet_forge_release_usage_mark_errors:rate5m
          expr: sum by (job) (rate(puppet_forge_release_usage_mark_total{result="error"}[5m]))

        - record: job_trigger:puppet_forge_upstream_sync_errors:rate5m
          expr: sum by (job, trigger) (rate(puppet_forge_upstream_sync_total{result="error"}[5m]))

        - record: job:puppet_forge_upstream_refresh_cycle_errors:rate5m
          expr: sum by (job) (rate(puppet_forge_upstream_refresh_cycles_total{result="error"}[5m]))

        - record: job_kind:puppet_forge_upstream_cache_requests:rate5m
          expr: sum by (job, kind) (rate(puppet_forge_upstream_cache_requests_total{result=~"hit|miss|stale"}[5m]))

        - record: job_kind:puppet_forge_upstream_cache_hit_ratio5m
          expr: |
            sum by (job, kind) (
              rate(puppet_forge_upstream_cache_requests_total{result="hit"}[5m])
            )
            /
            clamp_min(
              sum by (job, kind) (
                rate(puppet_forge_upstream_cache_requests_total{result=~"hit|miss|stale"}[5m])
              ),
              0.001
            )

    - name: puppet-forge.alerts
      interval: 30s
      rules:
        - alert: PuppetForgeHigh5xxErrorRatio
          expr: |
            job_route:puppet_forge_http_error_ratio5m > {{ .Values.prometheusRule.thresholds.http5xxErrorRatio }}
            and
            job_route:puppet_forge_http_requests:rate5m > {{ .Values.prometheusRule.thresholds.httpMinimumRequestRate }}
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Puppet Forge has elevated 5xx responses on {{ "{{ $labels.job }}" }} {{ "{{ $labels.route }}" }}"
            description: "5xx ratio has exceeded the configured threshold for at least 10 minutes on route {{ "{{ $labels.route }}" }}."

        - alert: PuppetForgeHTTPPanics
          expr: job_route:puppet_forge_http_panics:rate5m > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Puppet Forge recovered HTTP panics on {{ "{{ $labels.job }}" }} {{ "{{ $labels.route }}" }}"
            description: "HTTP handlers have recovered from panics for at least 5 minutes on route {{ "{{ $labels.route }}" }}."

        - alert: PuppetForgeHighP95Latency
          expr: |
            job_route:puppet_forge_http_latency_p95_seconds5m > {{ .Values.prometheusRule.thresholds.httpP95LatencySeconds }}
            and
            job_route:puppet_forge_http_requests:rate5m > {{ .Values.prometheusRule.thresholds.httpMinimumRequestRate }}
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Puppet Forge latency is high on {{ "{{ $labels.job }}" }} {{ "{{ $labels.route }}" }}"
            description: "P95 latency has exceeded the configured threshold for at least 15 minutes on route {{ "{{ $labels.route }}" }}."

        - alert: PuppetForgeTargetDown
          expr: up{job=~".*puppet-forge.*"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Puppet Forge target is down for {{ "{{ $labels.job }}" }}"
            description: "Prometheus has not been able to scrape {{ "{{ $labels.instance }}" }} for at least 5 minutes."

        - alert: PuppetForgeTargetsAbsent
          expr: absent(up{job=~".*puppet-forge.*"})
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Puppet Forge targets are absent"
            description: "Prometheus service discovery has exposed no Puppet Forge target for at least 5 minutes."

        - alert: PuppetForgeModuleMetricsNotReady
          expr: puppet_forge_module_metrics_ready == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Puppet Forge inventory metrics are not ready on {{ "{{ $labels.instance }}" }}"
            description: "The replica has not completed a successful module inventory refresh."

        - alert: PuppetForgeModuleMetricsStale
          expr: |
            time() - puppet_forge_module_metrics_last_success_timestamp_seconds > {{ .Values.prometheusRule.thresholds.moduleMetricsMaxAgeSeconds }}
            and
            puppet_forge_module_metrics_ready == 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Puppet Forge inventory metrics are stale on {{ "{{ $labels.instance }}" }}"
            description: "The replica's last successful module inventory refresh is older than the configured threshold."

        - alert: PuppetForgeModuleMetricsRefreshErrors
          expr: increase(puppet_forge_module_metrics_refresh_errors_total[10m]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Puppet Forge inventory refresh is failing on {{ "{{ $labels.instance }}" }}"
            description: "The replica has reported module inventory refresh failures during the last 10 minutes."

        - alert: PuppetForgeModuleMetricsTruncated
          expr: puppet_forge_module_metrics_truncated == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Puppet Forge inventory metrics are truncated on {{ "{{ $labels.instance }}" }}"
            description: "METRICS_MODULE_LIMIT is lower than the number of indexed module owners."

        - alert: PuppetForgePublishErrors
          expr: job:puppet_forge_publish_errors:rate5m > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Puppet Forge publish errors on {{ "{{ $labels.job }}" }}"
            description: "Module publish attempts have been failing for at least 10 minutes."

        - alert: PuppetForgeDeleteErrors
          expr: job:puppet_forge_delete_errors:rate5m > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Puppet Forge delete errors on {{ "{{ $labels.job }}" }}"
            description: "Module or release delete attempts have been failing for at least 10 minutes."

        - alert: PuppetForgeArtifactDeletionErrors
          expr: job:puppet_forge_artifact_deletion_errors:rate5m > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Puppet Forge artifact cleanup is failing on {{ "{{ $labels.job }}" }}"
            description: "Durable artifact deletion attempts have been failing for at least 10 minutes. SQL metadata is already deleted, but object-storage cleanup is pending."

        - alert: PuppetForgeArtifactDeletionsPending
          expr: job:puppet_forge_artifact_deletions_pending > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Puppet Forge has pending artifact deletions on {{ "{{ $labels.job }}" }}"
            description: "One or more local artifacts have remained in the durable deletion outbox for at least 15 minutes."

        - alert: PuppetForgeArtifactStreamErrors
          expr: job_source:puppet_forge_artifact_stream_errors:rate5m > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Puppet Forge artifact streams are failing on {{ "{{ $labels.job }}" }}"
            description: "Artifact response streams from {{ "{{ $labels.source }}" }} are terminating after HTTP headers have been sent. Clients may receive truncated archives despite a 200 or 206 status."

        - alert: PuppetForgeUpstreamArtifactIntegrityErrors
          expr: sum by (job) (increase(puppet_forge_upstream_artifact_integrity_total{result="error"}[15m])) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Puppet Forge upstream artifact integrity checks failed on {{ "{{ $labels.job }}" }}"
            description: "An upstream artifact could not be validated or repaired. Cached artifact or upstream storage health requires investigation."

        - alert: PuppetForgeUpstreamArtifactCleanupErrors
          expr: sum by (job) (increase(puppet_forge_upstream_artifact_cleanup_total{result="error"}[15m])) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Puppet Forge upstream artifact cleanup failed on {{ "{{ $labels.job }}" }}"
            description: "The lease-elected orphan cleanup worker failed. Unreferenced upstream-cache objects may accumulate."

        - alert: PuppetForgeReleaseUsageMarkErrors
          expr: job:puppet_forge_release_usage_mark_errors:rate5m > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Puppet Forge release usage tracking errors on {{ "{{ $labels.job }}" }}"
            description: "Release usage marks have been failing for at least 10 minutes, so active release protection may become stale."

        - alert: PuppetForgeUpstreamSingleSyncErrors
          expr: job_trigger:puppet_forge_upstream_sync_errors:rate5m{trigger="single"} > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Puppet Forge upstream on-demand sync is failing on {{ "{{ $labels.job }}" }}"
            description: "On-demand upstream module sync attempts have been failing for at least 10 minutes."

        - alert: PuppetForgeUpstreamRefreshErrors
          expr: job:puppet_forge_upstream_refresh_cycle_errors:rate5m > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Puppet Forge upstream refresh is failing on {{ "{{ $labels.job }}" }}"
            description: "Upstream refresh cycles have produced errors for at least 15 minutes."

        - alert: PuppetForgeUpstreamRefreshPartialFailure
          expr: |
            max by (job) (puppet_forge_upstream_refresh_last_error_timestamp_seconds)
            >
            max by (job) (puppet_forge_upstream_refresh_last_success_timestamp_seconds)
            and
            max by (job) (puppet_forge_upstream_refresh_modules{result="error"}) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Puppet Forge upstream refresh is partially failing on {{ "{{ $labels.job }}" }}"
            description: "The last upstream refresh cycle reported one or more per-module errors."

        - alert: PuppetForgeNoSuccessfulUpstreamRefresh
          expr: |
            time() - max by (job) (puppet_forge_upstream_refresh_last_success_timestamp_seconds) > {{ .Values.prometheusRule.thresholds.upstreamRefreshMaxAgeSeconds }}
            and
            max by (job) (puppet_forge_upstream_refresh_modules{result="attempted"}) > 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Puppet Forge has no successful upstream refresh on {{ "{{ $labels.job }}" }}"
            description: "No fully successful upstream refresh cycle has been recorded within the configured maximum age."

        - alert: PuppetForgeLowUpstreamCacheHitRatio
          expr: |
            job_kind:puppet_forge_upstream_cache_hit_ratio5m{kind="json"} < {{ .Values.prometheusRule.thresholds.upstreamJSONCacheMinimumHitRatio }}
            and
            job_kind:puppet_forge_upstream_cache_requests:rate5m{kind="json"} > {{ .Values.prometheusRule.thresholds.httpMinimumRequestRate }}
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Puppet Forge upstream JSON cache hit ratio is low on {{ "{{ $labels.job }}" }}"
            description: "The upstream JSON cache hit ratio has remained below the configured minimum for at least 30 minutes."

        - alert: PuppetForgeNoIndexedModules
          expr: |
            max by (job) (up{job=~".*puppet-forge.*"}) == 1
            unless on (job)
            job:puppet_forge_indexed_modules > 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Puppet Forge has no indexed modules on {{ "{{ $labels.job }}" }}"
            description: "The service is scrapeable, but no indexed modules have been exported for at least 30 minutes."

        - alert: PuppetForgeHighInFlightRequests
          expr: sum by (job) (puppet_forge_http_in_flight_requests) > {{ .Values.prometheusRule.thresholds.highInFlightRequests }}
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Puppet Forge has many in-flight requests on {{ "{{ $labels.job }}" }}"
            description: "The number of in-flight HTTP requests has exceeded the configured threshold for at least 15 minutes."

        - alert: PuppetForgeScrapeNearTimeout
          expr: scrape_duration_seconds{job=~".*puppet-forge.*"} / scrape_timeout_seconds{job=~".*puppet-forge.*"} > {{ .Values.prometheusRule.thresholds.scrapeTimeoutRatio }}
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Puppet Forge scrape is near timeout for {{ "{{ $labels.job }}" }}"
            description: "Prometheus scrape duration has exceeded the configured fraction of the scrape timeout for at least 10 minutes."

        - alert: PuppetForgeFileDescriptorsNearLimit
          expr: process_open_fds{job=~".*puppet-forge.*"} / process_max_fds{job=~".*puppet-forge.*"} > {{ .Values.prometheusRule.thresholds.fileDescriptorRatio }}
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Puppet Forge file descriptors are near the limit on {{ "{{ $labels.job }}" }}"
            description: "Open file descriptor usage has exceeded the configured fraction of the process limit for at least 15 minutes."
{{- end }}
