services:
  app:
    build:
      context: .
      args:
        LDFLAGS: ${LDFLAGS:-}
    depends_on:
      postgres:
        condition: service_healthy
      gcs:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    environment:
      APP_ENV: dev
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HTTP_ADDR: :8080
      METRICS_ADDR: :9090
      READ_HEADER_TIMEOUT: 10s
      READ_TIMEOUT: 0s
      WRITE_TIMEOUT: 0s
      IDLE_TIMEOUT: 60s
      HTTP_MAX_HEADER_BYTES: "1048576"
      SHUTDOWN_TIMEOUT: 10s
      DATABASE_BACKEND: postgres
      DATABASE_DSN: postgres://forge:forge@postgres:5432/forge?sslmode=disable
      DATABASE_MAX_CONNS: 10
      DATABASE_MIN_CONNS: 0
      DATABASE_MAX_CONN_LIFETIME: 1h
      DATABASE_MAX_CONN_IDLE_TIME: 30m
      ADMIN_TOKEN: ${ADMIN_TOKEN:-forge-admin-token-local-change-me-32-bytes}
      ACCESS_TOKEN_PEPPER: ${ACCESS_TOKEN_PEPPER:-local-access-token-pepper-change-me}
      MANAGE_SESSION_SECRET: ${MANAGE_SESSION_SECRET:-local-manage-session-secret-change-me}
      ACCESS_TOKEN_HISTORY_TTL: ${ACCESS_TOKEN_HISTORY_TTL:-2160h}
      DELETED_RELEASE_TTL: ${DELETED_RELEASE_TTL:-2160h}
      # gcs
#      ARTIFACT_BACKEND: gcs
#      ARTIFACT_ENDPOINT: http://gcs:4443
#      ARTIFACT_GCS_ANONYMOUS: "true"
      # gcs
      # minio
      ARTIFACT_BACKEND: s3
      ARTIFACT_ENDPOINT: http://minio:9000
      ARTIFACT_ACCESS_KEY_ID: minioadmin
      ARTIFACT_SECRET_ACCESS_KEY: minioadmin
      ARTIFACT_PATH_STYLE: true
      # minio
      ARTIFACT_BUCKET: puppet-forge-artifacts
      ARTIFACT_PROJECT: local-dev
      ARTIFACT_ENSURE_BUCKET: "true"
      ARTIFACT_PREFIX: modules
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      ALLOWED_PUBLIC_HOSTS: ${ALLOWED_PUBLIC_HOSTS:-}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      TRUST_FORWARDED_HEADERS: ${TRUST_FORWARDED_HEADERS:-false}
      PUBLIC_MODULE_ACCESS: ${PUBLIC_MODULE_ACCESS:-false}
      ACTIVE_RELEASE_TTL: ${ACTIVE_RELEASE_TTL:-720h}
      RELEASE_CONSUMER_TTL: ${RELEASE_CONSUMER_TTL:-4320h}
      SECURITY_HSTS_ENABLED: ${SECURITY_HSTS_ENABLED:-false}
      WEB_AUTH_MODE: ${WEB_AUTH_MODE:-none}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URL: ${OIDC_REDIRECT_URL:-}
      OIDC_LOGOUT_URL: ${OIDC_LOGOUT_URL:-}
      OIDC_COOKIE_SECRET: ${OIDC_COOKIE_SECRET:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid profile email}
      OIDC_SIGNING_ALGORITHMS: ${OIDC_SIGNING_ALGORITHMS:-RS256}
      UPSTREAM_URL: https://forgeapi.puppet.com
      UPSTREAM_PROXY_JSON_CACHE_TTL: 5m
      UPSTREAM_PROXY_JSON_STALE_TTL: 1h
      FORGE_CACHE_MAX_BODY_BYTES: 1048576
      MODULE_UPLOAD_MAX_BYTES: 134217728
      UPSTREAM_ARTIFACT_MAX_BYTES: 134217728
      UPSTREAM_ARTIFACT_ORPHAN_TTL: 24h
      UPSTREAM_SYNC_INTERVAL: 15m
      UPSTREAM_SYNC_LIMIT: 1000
      UPSTREAM_SYNC_CONCURRENCY: 8
      METRICS_RELEASE_CONSUMER_LIMIT: 10000
    ports:
      - "8080:8080"
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: forge
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "forge", "-d", "forge"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

  gcs:
    image: fsouza/fake-gcs-server:1.56.1
    command:
      - -scheme
      - http
      - -backend
      - memory
      - -public-host
      - gcs:4443
    ports:
      - "4443:4443"

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command:
      - server
      - /data
      - --console-address
      - :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -lc
    command:
      - >
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/puppet-forge-artifacts

  prometheus:
    image: prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    depends_on:
      app:
        condition: service_healthy
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "9091:9090"
    volumes:
      - ./examples/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./examples/prometheus/alerts:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:13.2.2
    depends_on:
      - prometheus
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        mkdir -p /tmp/grafana-dashboards
        sed 's/[$]{DS_PROMETHEUS}/prometheus/g' /etc/grafana/dashboard-source/puppet-forge.json > /tmp/grafana-dashboards/puppet-forge.json
        exec /run.sh
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./examples/grafana/provisioning/datasources/prometheus.yml:/etc/grafana/provisioning/datasources/puppet-forge.yml:ro
      - ./examples/grafana/provisioning/dashboards/puppet-forge.yml:/etc/grafana/provisioning/dashboards/puppet-forge.yml:ro
      - ./examples/grafana/puppet-forge-dashboard.json:/etc/grafana/dashboard-source/puppet-forge.json:ro
      - grafana-data:/var/lib/grafana

  r10k:
    image: puppet/r10k:latest@sha256:5b4035157e60fcd99c7a5785453bc81e3c12c1a54924b168768bbc5433bce93a
    depends_on:
      app:
        condition: service_started
    working_dir: /work
    command:
      - puppetfile
      - install
      - --moduledir=/tmp/r10k-modules
      - --config=/work/r10k.yaml
      - --verbose=info
    configs:
      - source: r10k_puppetfile
        target: /work/Puppetfile
      - source: r10k_config
        target: /work/r10k.yaml

configs:
  r10k_puppetfile:
    content: |
      mod 'puppetlabs-apt', '11.3.1'
      mod 'puppet-archive', '8.1.0'
      mod 'puppetlabs-ntp', '11.1.1'
      mod 'saz-timezone', '7.0.0'
      mod 'stm-debconf', '7.0.1'
      mod 'LeLutin-smartd', '2.6.3'
      mod 'puppetlabs-concat', '9.1.0'
  r10k_config:
    content: |
      ---
      cachedir: '/tmp/r10k-cache'

      forge:
        baseurl: 'http://app:8080'
        authorization_token: 'Bearer ${ADMIN_TOKEN:-forge-admin-token-local-change-me-32-bytes}'

volumes:
  grafana-data:
  postgres-data:
  prometheus-data:
  minio-data:
