services:
  app:
    build:
      context: .
      args:
        LDFLAGS: ${LDFLAGS:-}
    depends_on:
      postgres:
        condition: service_healthy
      gcs:
        condition: service_started
      seaweedfs:
        condition: service_healthy
    environment:
      APP_ENV: dev
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HTTP_ADDR: :8080
      METRICS_ADDR: :9090
      READ_HEADER_TIMEOUT: 10s
      READ_TIMEOUT: 0s
      WRITE_TIMEOUT: 0s
      IDLE_TIMEOUT: 60s
      HTTP_MAX_HEADER_BYTES: "1048576"
      SHUTDOWN_TIMEOUT: 10s
      DATABASE_BACKEND: postgres
      DATABASE_DSN: postgres://forge:forge@postgres:5432/forge?sslmode=disable
      DATABASE_MAX_CONNS: 10
      DATABASE_MIN_CONNS: 0
      DATABASE_MAX_CONN_LIFETIME: 1h
      DATABASE_MAX_CONN_IDLE_TIME: 30m
      ADMIN_TOKEN: ${ADMIN_TOKEN:-forge-admin-token-local-change-me-32-bytes}
      ACCESS_TOKEN_PEPPER: ${ACCESS_TOKEN_PEPPER:-local-access-token-pepper-change-me}
      MANAGE_SESSION_SECRET: ${MANAGE_SESSION_SECRET:-local-manage-session-secret-change-me}
      ACCESS_TOKEN_HISTORY_TTL: ${ACCESS_TOKEN_HISTORY_TTL:-2160h}
      DELETED_RELEASE_TTL: ${DELETED_RELEASE_TTL:-2160h}
      # gcs
#      ARTIFACT_BACKEND: gcs
#      ARTIFACT_ENDPOINT: http://gcs:4443
#      ARTIFACT_GCS_ANONYMOUS: "true"
      # gcs
      # s3
      ARTIFACT_BACKEND: s3
      ARTIFACT_ENDPOINT: http://seaweedfs:8333
      ARTIFACT_ACCESS_KEY_ID: forge-local
      ARTIFACT_SECRET_ACCESS_KEY: forge-local-secret
      ARTIFACT_PATH_STYLE: "true"
      # s3
      ARTIFACT_BUCKET: puppet-forge-artifacts
      ARTIFACT_PROJECT: local-dev
      ARTIFACT_ENSURE_BUCKET: "true"
      ARTIFACT_PREFIX: modules
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      ALLOWED_PUBLIC_HOSTS: ${ALLOWED_PUBLIC_HOSTS:-}
      README_IMAGE_ALLOWED_HOSTS: ${README_IMAGE_ALLOWED_HOSTS-img.shields.io,github.com,coveralls.io,s3.amazonaws.com,www.puppetmodule.info}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      TRUST_FORWARDED_HEADERS: ${TRUST_FORWARDED_HEADERS:-false}
      PUBLIC_MODULE_ACCESS: ${PUBLIC_MODULE_ACCESS:-false}
      ACTIVE_RELEASE_TTL: ${ACTIVE_RELEASE_TTL:-720h}
      RELEASE_CONSUMER_TTL: ${RELEASE_CONSUMER_TTL:-4320h}
      SECURITY_HSTS_ENABLED: ${SECURITY_HSTS_ENABLED:-false}
      WEB_AUTH_MODE: ${WEB_AUTH_MODE:-none}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URL: ${OIDC_REDIRECT_URL:-}
      OIDC_LOGOUT_URL: ${OIDC_LOGOUT_URL:-}
      OIDC_COOKIE_SECRET: ${OIDC_COOKIE_SECRET:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid profile email}
      OIDC_SIGNING_ALGORITHMS: ${OIDC_SIGNING_ALGORITHMS:-RS256}
      UPSTREAM_URL: https://forgeapi.puppet.com
      UPSTREAM_PROXY_JSON_CACHE_TTL: 5m
      UPSTREAM_PROXY_JSON_STALE_TTL: 1h
      FORGE_CACHE_MAX_BODY_BYTES: 1048576
      MODULE_UPLOAD_MAX_BYTES: 134217728
      UPSTREAM_ARTIFACT_MAX_BYTES: 134217728
      UPSTREAM_ARTIFACT_ORPHAN_TTL: 24h
      UPSTREAM_SYNC_INTERVAL: 15m
      UPSTREAM_SYNC_LIMIT: 1000
      UPSTREAM_SYNC_CONCURRENCY: 8
      METRICS_RELEASE_CONSUMER_LIMIT: 10000
    ports:
      - "8080:8080"
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  postgres:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_DB: forge
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "forge", "-d", "forge"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

  gcs:
    image: fsouza/fake-gcs-server:1.56.1@sha256:797ce226d62f947c009dc40246b30cfb456b8473d8241407f9d6f2c04e4d69ef
    command:
      - -scheme
      - http
      - -backend
      - memory
      - -public-host
      - gcs:4443
    ports:
      - "4443:4443"

  seaweedfs:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    command:
      - mini
      - -dir=/data
      - -ip=seaweedfs
      - -ip.bind=0.0.0.0
      - -master.volumeSizeLimitMB=128
      - -master.telemetry=false
      - -s3.autoCreateBucket=false
      - -s3.allowDeleteBucketNotEmpty=false
      - -webdav=false
      - -admin.ui=false
    environment:
      AWS_ACCESS_KEY_ID: forge-local
      AWS_SECRET_ACCESS_KEY: forge-local-secret
      S3_BUCKET: puppet-forge-artifacts
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "3", "http://localhost:8333/readyz"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - seaweedfs-data:/data

  prometheus:
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    depends_on:
      app:
        condition: service_healthy
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "9091:9090"
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
      - source: prometheus_puppet_forge_rules
        target: /etc/prometheus/puppet-forge-rules.yml
    volumes:
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    depends_on:
      - prometheus
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        mkdir -p /tmp/grafana-dashboards
        sed 's/[$]{DS_PROMETHEUS}/prometheus/g' /etc/grafana/dashboard-source/puppet-forge.json > /tmp/grafana-dashboards/puppet-forge.json
        exec /run.sh
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    configs:
      - source: grafana_prometheus_datasource
        target: /etc/grafana/provisioning/datasources/puppet-forge.yml
      - source: grafana_dashboard_provider
        target: /etc/grafana/provisioning/dashboards/puppet-forge.yml
      - source: grafana_puppet_forge_dashboard
        target: /etc/grafana/dashboard-source/puppet-forge.json
    volumes:
      - grafana-data:/var/lib/grafana

  r10k:
    image: puppet/r10k:3.15.2@sha256:5b4035157e60fcd99c7a5785453bc81e3c12c1a54924b168768bbc5433bce93a
    depends_on:
      app:
        condition: service_started
    working_dir: /work
    command:
      - puppetfile
      - install
      - --moduledir=/tmp/r10k-modules
      - --config=/work/r10k.yaml
      - --verbose=info
    configs:
      - source: r10k_puppetfile
        target: /work/Puppetfile
      - source: r10k_config
        target: /work/r10k.yaml

configs:
  prometheus_config:
    content: |
      global:
        scrape_interval: 15s
        evaluation_interval: 15s

      rule_files:
        - /etc/prometheus/puppet-forge-rules.yml

      scrape_configs:
        - job_name: puppet-forge
          static_configs:
            - targets:
                - app:9090
  prometheus_puppet_forge_rules:
    file: ./examples/prometheus/alerts/puppet-forge.yml
  grafana_prometheus_datasource:
    content: |
      apiVersion: 1

      datasources:
        - name: Prometheus
          uid: prometheus
          type: prometheus
          access: proxy
          url: http://prometheus:9090
          isDefault: true
          editable: false
  grafana_dashboard_provider:
    content: |
      apiVersion: 1

      providers:
        - name: Puppet Forge
          type: file
          disableDeletion: true
          editable: false
          options:
            path: /tmp/grafana-dashboards
  grafana_puppet_forge_dashboard:
    file: ./examples/grafana/puppet-forge-dashboard.json
  r10k_puppetfile:
    content: |
      mod 'puppetlabs-apt', '11.3.1'
      mod 'puppet-archive', '8.1.0'
      mod 'puppetlabs-ntp', '11.1.1'
      mod 'saz-timezone', '7.0.0'
      mod 'stm-debconf', '7.0.1'
      mod 'LeLutin-smartd', '2.6.3'
      mod 'puppetlabs-concat', '9.1.0'
  r10k_config:
    content: |
      ---
      cachedir: '/tmp/r10k-cache'

      forge:
        baseurl: 'http://app:8080'
        authorization_token: 'Bearer ${ADMIN_TOKEN:-forge-admin-token-local-change-me-32-bytes}'

volumes:
  grafana-data:
  postgres-data:
  prometheus-data:
  seaweedfs-data:
